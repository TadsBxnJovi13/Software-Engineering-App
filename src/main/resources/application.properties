spring.application.name=social

# Database connection. Set DB_PASSWORD to the password configured for the local
# PostgreSQL `postgres` role before starting the application.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/social}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DB_DDL:update}

# JWT secret key (must be at least 32 characters for HS256)
jwt.secret=${JWT_SECRET:change-this-development-secret-key-before-deploying}

# Optional: token expiration (15 minutes)
jwt.expiration=900000
